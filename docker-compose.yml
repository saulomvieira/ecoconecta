
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: java-ecoconecta

    working_dir: /workspace

    volumes:
      - ./backend:/workspace
      - ~/.m2:/root/.m2

    ports:
      - "8080:8080"

    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      SERVER_ERROR_INCLUDE_STACKTRACE: never
      FRONTEND_URL: http://localhost:5173
      UPLOAD_DIR: /workspace/uploads/residuos
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}

    depends_on:
      db:
        condition: service_healthy

    command: >
      sh -c "mvn clean install -DskipTests &&
             mvn spring-boot:run"

    # Saudável só quando o Tomcat já aceita conexões na 8080. O start_period cobre
    # o `mvn clean install` (na primeira vez baixa as dependências).
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 8080"]
      interval: 5s
      timeout: 3s
      start_period: 60s
      retries: 90

  db:
    image: postgres:17-alpine

    container_name: postgres-ecoconecta

    restart: unless-stopped

    environment:
      POSTGRES_DB: ecoconecta
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}

    ports:
      - "127.0.0.1:5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ecoconecta"]
      interval: 5s
      timeout: 5s
      retries: 10

  frontend:
    build:
      context: ./frontend

    container_name: react-ecoconecta

    depends_on:
      app:
        condition: service_healthy

    environment:
      VITE_PROXY_TARGET: http://app:8080

    ports:
      - "5173:5173"

    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  postgres_data:
