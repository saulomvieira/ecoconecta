services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: java-ecoconecta
    volumes:
      - ./backend:/workspace
      - ~/.m2:/root/.m2
    working_dir: /workspace
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
    command: >
      sh -c "mvn clean install -DskipTests &&
             mvn spring-boot:run"
